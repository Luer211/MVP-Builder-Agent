[project]
name = "mvp-builder-agent"
version = "0.1.0"
description = "Generate structured MVP engineering docs from a product idea."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "langgraph>=0.2.0",
    "openai>=2.43.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.11.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
